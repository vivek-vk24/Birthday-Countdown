<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Jaanu ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#ff4f87,#ff7db5,#ffd5e9);
color:white;
overflow-x:hidden;
min-height:100vh;
}

/* Floating Hearts */

.heart{
position:fixed;
bottom:-50px;
pointer-events:none;
animation:floatUp linear infinite;
z-index:1;
}

@keyframes floatUp{
0%{
transform:translateY(0);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

/* Countdown */

#countdownPage{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
position:relative;
z-index:5;
}

#countdownPage h1{
font-size:3rem;
margin-bottom:15px;
}

#countdown{
margin-top:25px;
font-size:2rem;
font-weight:bold;
padding:25px;
border-radius:25px;
background:rgba(255,255,255,.17);
backdrop-filter:blur(10px);
}

/* Birthday Page */

#birthdayPage{
display:none;
position:relative;
z-index:5;
padding-bottom:60px;
}

.hero{
padding:70px 20px 40px;
text-align:center;
}

.hero h1{
font-size:3rem;
margin-bottom:10px;
}

.music-wrap{
text-align:center;
margin:20px;
}

.music-wrap button{
padding:15px 25px;
border:none;
border-radius:30px;
font-size:1rem;
font-weight:bold;
cursor:pointer;
}

/* Letter */

.letter{
max-width:900px;
margin:25px auto;
padding:25px;
background:rgba(255,255,255,.15);
border-radius:25px;
line-height:1.9;
}

#typedLetter{
white-space:pre-wrap;
}

/* Gallery */

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
padding:20px;
max-width:1100px;
margin:auto;
}

.gallery img{
width:100%;
height:280px;
object-fit:cover;
border-radius:20px;
}

/* Flip Cards */

.cards{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:20px;
}

.flip-card{
width:220px;
height:220px;
perspective:1000px;
}

.flip-inner{
width:100%;
height:100%;
position:relative;
transform-style:preserve-3d;
transition:.8s;
}

.flip-card:hover .flip-inner{
transform:rotateY(180deg);
}

.front,.back{
position:absolute;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
text-align:center;
border-radius:20px;
backface-visibility:hidden;
}

.front{
background:#ff5f9d;
}

.back{
background:white;
color:#ff4081;
transform:rotateY(180deg);
}

/* Timeline */

.timeline{
max-width:900px;
margin:auto;
padding:20px;
}

.timeline-item{
background:rgba(255,255,255,.15);
padding:18px;
margin:12px 0;
border-radius:18px;
}

/* Envelope */

.envelope{
text-align:center;
padding:40px;
}

.envelope button{
padding:15px 25px;
border:none;
border-radius:25px;
cursor:pointer;
font-weight:bold;
}

#surprise{
display:none;
margin-top:20px;
font-size:1.1rem;
}

/* Confetti */

.confetti{
position:fixed;
width:10px;
height:10px;
top:-10px;
z-index:999;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(120vh) rotate(720deg);
}
}

@media(max-width:768px){

#countdownPage h1{
font-size:2.2rem;
}

.hero h1{
font-size:2.2rem;
}

#countdown{
font-size:1.2rem;
}

}

</style>
</head>
